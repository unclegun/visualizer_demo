  <polygon points="690,128 1046,210 940,454 626,374" fill="#ff8f68" fill-opacity="0.18" />
  <polygon points="146,320 412,244 560,584 280,664" fill="#ff52a1" fill-opacity="0.2" />
  <polygon points="742,456 1084,528 1006,720 666,676" fill="#ffd26d" fill-opacity="0.18" />
