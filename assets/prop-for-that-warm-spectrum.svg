<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Warm spectrum artwork</title>
  <desc id="desc">Warm magenta, amber, and coral abstract artwork for image color extraction demos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#220814" />
      <stop offset="55%" stop-color="#40111b" />
      <stop offset="100%" stop-color="#13060d" />
    </linearGradient>
    <radialGradient id="sunA" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#ffd479" />
      <stop offset="45%" stop-color="#ff8d52" />
      <stop offset="100%" stop-color="#ff5b7a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beamA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb36b" />
      <stop offset="100%" stop-color="#ff4fa2" />
    </linearGradient>
    <linearGradient id="beamB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6c63" />
      <stop offset="100%" stop-color="#ffd36c" />
