name: Daily Penny-Stock Watchlist

on:
  schedule:
    # Run at 07:30 UTC on every weekday (Mon-Fri)
    # This is approximately 3:30 AM ET / 12:30 AM PT – well before US market open
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "Maximum number of tickers to scan"
        required: false
        default: "50"
      price_min:
        description: "Minimum price filter (USD)"
        required: false
        default: "0.10"
      price_max:
        description: "Maximum price filter (USD)"
        required: false
        default: "5.00"

permissions:
  contents: write   # Required to commit updated recommendations.json

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penny-stock-watchlist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git log and blame work correctly
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requests is used for HTTP; no other paid or heavy deps
          pip install requests

      - name: Generate recommendations
        env:
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '50' }}
          PRICE_MIN:   ${{ github.event.inputs.price_min   || '0.10' }}
          PRICE_MAX:   ${{ github.event.inputs.price_max   || '5.00' }}
        run: python scripts/generate_recommendations.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recommendations.json data/history/
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update watchlist $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
